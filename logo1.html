<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velocity Motors</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#420a0ade;
    color:white;
}

.navbar{
    width:100%;
    background:#420a0ade;
    padding:20px 50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#e1e5eb;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#60a5fa;
}

.contenedor{
    padding:50px;
}


.titulo{
    text-align:center;
    margin-bottom:50px;
}

.titulo h1{
    font-size:50px;
    margin-bottom:10px;
}

.titulo p{
    color:#cbd5e1;
    font-size:18px;
}


.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:#420a0ade;
    border-radius:20px;
    overflow:hidden;
    transition:0.4s;
    border:1px solid rgba(255,255,255,0.08);
}

.card:hover{
    transform:translateY(-10px);
}


.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    object-position:center;
    transition:0.4s;
}

.card img:hover{
    transform:scale(1.05);
}


.card-content{
    padding:25px;
}

.card-content h3{
    margin-bottom:15px;
    color:#f9fafc;
    font-size:28px;
}

.card-content p{
    color:#cbd5e1;
    line-height:1.7;
    font-size:15px;
}

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        padding:20px;
    }

    .nav-links{
        margin-top:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .contenedor{
        padding:20px;
    }

    .titulo h1{
        font-size:35px;
    }

    .card img{
        height:220px;
    }

}

</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">Viento a Favor</div>

    <ul class="nav-links">

        <li><a href="index.html">Inicio</a></li>
        <li><a href="motos.html">Motos</a></li>
        <li><a href="Registro.html">Contacto</a></li>

    </ul>

</nav>



<div class="contenedor">

    <div class="titulo">

        <h1>Pulsar</h1>

    </div>

    

    <div class="cards">

        <div class="card">

            <a href="pulsar1.html">
                <img src="imagenes/moto1.jpeg" alt="Moto Deportiva">
            </a>

            <div class="card-content">

                <h3>Pulsar NS160 UG</h3>

                <h2>
                   Q18,900.00
                </h2>

            </div>

        </div>
        

        <div class="card">

            <a href="pulsar2.html">
                <img src="imagenes/moto2.jpeg" alt="Moto Naked">
            </a>

            <div class="card-content">

                <h3>Pulsar NS200 UG</h3>

                <h2>
                   Q26,500.00
                </h2>

            </div>

        </div>


        <div class="card">

            <a href="pulsar3.html">
                <img src="imagenes/moto3.jpeg" alt="Moto Chopper">
            </a>

            <div class="card-content">

                <h3>Pulsar NS200 Fi</h3>

                <h2>
                   Q25,000.00
                </h2>

            </div>

        </div>

        <div class="card">

            <a href="pulsar4.html">
                <img src="imagenes/moto4.jpeg" alt="Moto Deportiva">
            </a>

            <div class="card-content">

                <h3>Pulsar NS200 FI ABS</h3>

                <h2>
                   Q27,500.00
                </h2>

            </div>

        </div>

        <div class="card">

            <a href="pulsar4.html">
                <img src="imagenes/moto5.jpeg" alt="Moto Deportiva">
            </a>

            <div class="card-content">

                <h3>Pulsar NS160 TD</h3>

                <h2>
                   Q17,500.00
                </h2>

            </div>

        </div>


    </div>

</div>

</body>
</html>
