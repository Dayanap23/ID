<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#990036,#000000,#b30056);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:90px;
}

/* NAVBAR */

.navbar{
    width:100%;
    background:#990036;
    padding:15px 45px;
    position:fixed;
    top:0;
    left:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:1000;
}

.logo{
    color:#fdfdfd;
    font-size:28px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#60a5fa;
}

/* CARD */

.card{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);

    padding:35px;
    border-radius:20px;

    box-shadow:0 8px 25px rgba(0,0,0,0.3);

    text-align:center;
    color:white;
}

.card h1{
    margin-bottom:25px;
    font-size:38px;
}

/* FORMULARIO */

.input-box{
    margin-bottom:20px;
}

.input-box input,
.input-box textarea{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:15px;
}



/* BOTONES */

button,
.boton{
    display:inline-block;
    margin-top:10px;
    padding:14px 30px;

    border:none;
    border-radius:12px;

    background:#2563eb;
    color:white;

    text-decoration:none;
    font-size:16px;
    cursor:pointer;

    transition:0.3s;
}

button:hover,
.boton:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

/* RESPONSIVE */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        padding:20px;
    }

    .nav-links{
        margin-top:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .card h1{
        font-size:30px;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">Viento a Favor</div>

    <ul class="nav-links">

        <li><a href="index.html">Inicio</a></li>
        <li><a href="Motos.html">Motos</a></li>
        <li><a href="Registro.html">Contacto</a></li>

    </ul>

</nav>

<!-- FORMULARIO -->

<div class="card">

    <h1>¡Compra Ya!</h1>

    <form action="https://formspree.io/f/xeevebao" method="POST">

        <div class="input-box">
            <input type="text" name="name" placeholder="Nombre" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="correo" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="Direccion" required>
        </div>

        <div class="input-box">
            <textarea name="message" placeholder="Escribe tu mensaje..." required></textarea>
        </div>

        <button type="submit">Realizar Compra</button>

    </form>

    <br>

    <a href="index.html" class="boton">
        Volver
    </a>

</div>

</body>
</html>
